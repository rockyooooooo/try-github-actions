name: Auto Tag and Release

# on:
#   pull_request:
#     types: [closed]
#     branches:
#       - production
on:
  workflow_dispatch:

jobs:
  create-tag-and-release:
    # Only run this job if the PR was merged (not just closed)
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: generate_tag
        run: |
          # Generate tag based on date (vYYYYMMDD.N format)
          DATE=$(date +'%Y%m%d')

          # Get the latest tag for today (if any)
          LATEST_TAG=$(git tag -l "v$DATE.*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # No tag exists for today, create first one
            NEW_TAG="v$DATE.1"
          else
            # Increment the counter
            COUNTER=$(echo $LATEST_TAG | awk -F'.' '{print $NF}')
            NEXT_COUNTER=$((COUNTER + 1))
            NEW_TAG="v$DATE.$NEXT_COUNTER"
          fi

          echo "Generated new tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.generate_tag.outputs.new_tag }}
          git push origin ${{ steps.generate_tag.outputs.new_tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.new_tag }}
          name: ${{ steps.generate_tag.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
    outputs:
      new_tag: ${{ steps.generate_tag.outputs.new_tag }}
  slack-notification:
    name: Slack Notification
    needs: create-tag-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"${{ needs.create-tag-and-release.outputs.new_tag }} omnitag deployed \n https://github.com/rockyooooooo/try-github-actions/releases/tag/${{ needs.create-tag-and-release.outputs.new_tag }}"}' https://hooks.slack.com/services/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<D-z>
      # - uses: actions/checkout@v4
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_MESSAGE: "${{ needs.create-tag-and-release.outputs.new_tag }} omnitag deployed \n https://github.com/rockyooooooo/try-github-actions/releases/tag/${{ needs.create-tag-and-release.outputs.new_tag }}"
