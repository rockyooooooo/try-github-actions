version: '2.1'
orbs:
  gh: circleci/github-cli@2.6
  node: circleci/node@5.3.0
jobs:
  test:
    docker:
      - image: "cimg/node:20.10.0"
    steps:
      - checkout
      - run:
          name: Run tests
          command: |
            npm install
            npm test
  tag-and-release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Set up SSH keys
          command: |
            mkdir -p ~/.ssh
            echo "$MY_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - gh/install
      - run:
          name: Generate and create tag
          command: |
            DATE=$(date +'%Y%m%d')

            # Check if there are any tags for today (including cases with and without suffix)
            BASE_TAG="test-v$DATE"
            ALL_TAGS=$(git tag -l "$BASE_TAG*" | sort -V)

            if [ -z "$ALL_TAGS" ]; then
              # No tags for today, create the first tag
              NEW_TAG="$BASE_TAG"
            else
              # Tags already exist, get the latest tag
              LATEST_TAG=$(echo "$ALL_TAGS" | tail -n 1)
              if [[ "$LATEST_TAG" == "$BASE_TAG" ]]; then
                # If the latest tag has no suffix, use .1
                NEW_TAG="${BASE_TAG}.1"
              else
                # Extract the suffix number and increment it by 1
                COUNTER=$(echo "$LATEST_TAG" | awk -F'.' '{print $NF}')
                NEXT_COUNTER=$((COUNTER + 1))
                NEW_TAG="${BASE_TAG}.$NEXT_COUNTER"
              fi
            fi

            echo "Generated new tag: $NEW_TAG"
            echo "export NEW_TAG=$NEW_TAG" >> $BASH_ENV

            # git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/allenliaooooooo/try-github-actions.git
            # Create and push tag
            git tag $NEW_TAG
            git push origin $NEW_TAG
      - run:
          name: Create GitHub Release
          command: |
            gh release create $NEW_TAG \
              --title $NEW_TAG \
              --generate-notes
  trigger-github-actions:
    docker:
      - image: curlimages/curl:latest
    steps:
      - run:
          name: Trigger GitHub Actions
          command: |
            # curl -X POST \
            #   -H "Accept: application/vnd.github.v3+json" \
            #   -H "Authorization: token ${GITHUB_TOKEN}" \
            #   https://api.github.com/repos/rockyooooooo/try-github-actions/actions/workflows/auto-release.yml/dispatches \
            #   -d '{"ref":"production"}'
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/rockyooooooo/try-github-actions/actions/workflows/auto-release.yml/dispatches \
  get-github-pr-target-branch:
    docker:
      - image: "cimg/node:20.10.0"
    executor:
      name: node/default
      tag: "20.10.0"
    steps:
      - checkout
      - run: node -v
      - run:
          name: Get GitHub PR Target Branch
          command: |
            echo "CIRCLE_BRANCH: $CIRCLE_BRANCH"
            echo "CIRCLE_PULL_REQUEST: $CIRCLE_PULL_REQUEST"
            echo "CIRCLE_PULL_REQUESTS: $CIRCLE_PULL_REQUESTS"
            echo "CIRCLE_PROJECT_USERNAME: $CIRCLE_PROJECT_USERNAME"
            echo "CIRCLE_PROJECT_REPONAME: $CIRCLE_PROJECT_REPONAME"

            if [ ! -z "$CIRCLE_PULL_REQUEST" ]; then
              PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed -n 's/.*\/pull\/\([0-9]*\)$/\1/p')
              echo "PR Number: $PR_NUMBER"
              
              TARGET_BRANCH=$(curl -L -s \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUMBER" | jq -r .base.ref)
              echo "Target branch: $TARGET_BRANCH"
            else
              exit 1
            fi
workflows:
  test-and-release:
    jobs:
      # - test
      - tag-and-release:
          requires:
            - test
          filters:
            branches:
              only: production
      # - trigger-github-actions:
      #     requires:
      #       - test
      #     filters:
      #       branches:
      #         only: production
      # - get-github-pr-target-branch